name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for testing Device Floorplan (beta)! A screenshot usually says more than words.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - Floorplan Editor (sidebar)
        - Dashboard card
        - Card editor
        - Setup / integration
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Device Floorplan version
      placeholder: "0.4.7"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.x"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / app
      placeholder: "Chrome on Windows, HA app on iPad, Fully Kiosk…"
  - type: textarea
    id: shots
    attributes:
      label: Screenshots
      description: Drag images here. Please hide anything private (names, addresses).
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Errors from Settings → System → Logs, or the browser console (F12).
      render: text
