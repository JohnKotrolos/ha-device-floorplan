name: Idea / feature request
description: Something you'd like Device Floorplan to do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe what you want to see or do. A sketch or screenshot of your setup helps.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why? (your use case)
