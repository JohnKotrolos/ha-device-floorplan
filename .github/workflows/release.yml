name: Release asset

# Attaches device_floorplan.zip to every published release.
# The Marketplace/HACS installs from this zip and shows its download count.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the zip to"
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Build zip
        run: |
          cd custom_components/device_floorplan
          zip -r "$GITHUB_WORKSPACE/device_floorplan.zip" . -x '*/__pycache__/*' '*.pyc'
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" device_floorplan.zip --clobber
